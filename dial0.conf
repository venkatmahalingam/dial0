# ======================= Dial 0 settings =======================
# Edit here, or change from the command line:   dial0 ctl set CPUS=2 MEMORY=6g
# Values: no spaces. Sizes: number + g or m (e.g. 6g, 512m).

# ---- Resources (applied by a quick container restart, no rebuild) ----
CPUS=1                        # CPU cores for Dial 0 (= llama.cpp threads). At least 1 core stays with SONiC.
CPUSET=auto                   # which cores: auto = the highest-numbered CPUS cores; or a list like 2,3 or 2-3
MEMORY=5g                     # RAM limit (hard). Needs model size + ~1 GB.
STORAGE=8g                    # disk budget for Dial 0 (images + model + sessions + logs). See README "Storage".

# ---- Behaviour (quick restart) ----
CONFIRM=ask                   # ask = y/N before any change | dry-run = never change | auto = no prompt
CONTEXT=off                   # off = each dial0 request is fresh | on = model also sees earlier requests + commands
                              #   (per request: dial0 --context "..." / --no-context; named sessions -s NAME use context)
LEARN=on                      # on = reuse commands of earlier approved requests (no model call) | off = never reuse
SONIC_SRC_DIR=auto            # the switch's installed SONiC CLI (dir with config/ and show/), used as the command reference.
                              #   auto = /usr/local/lib/python3.11/dist-packages (or other python dist-packages)
SEARCH_RETRY=on               # on = if nothing in the first list fits, search that CLI source and ask the model once more
CMDREF=reference/sonic-command-reference.md
                              # the command reference: ONLY the commands in its code blocks are offered to and accepted
                              #   from the model (checked against the switch's CLI code where it defines them).
                              #   A file in this folder, an absolute path, or a URL. After editing: dial0 ctl cmdref
LLAMA_CTX=8192                # model context window (tokens); room for the full command list
LLAMA_PORT=18081              # llama.cpp engine port on 127.0.0.1 (host network: must be free on the switch)
API_PORT=8090                 # Dial 0 agent API port on 127.0.0.1 (must be free on the switch)
REPAIR_WITH_MODEL=off         # on = if the model proposes an invalid command, spend a 2nd model call fixing it
WORKFLOW_INSIGHTS=on          # on = when a workflow finds problems, the model analyses findings + system log (1 call)
WORKFLOW_KEEP=10              # results kept per workflow (health, logs, ...) unless set per workflow: dial0 workflow keep
FIX_ROUNDS=3                  # when SONiC returns an error, rounds of "model proposes a fix" before giving up (0 = none)
WARMUP=auto                   # auto = with a command reference file, pre-load its full list once at startup (then cached)
BANNER=on                     # on = show the Dial 0 banner when entering the dial0> prompt (terminal only)
REASONING=on                  # on = model states a one-sentence reason for its choice (~5 s extra on 1 CPU)
LIVE_CHECK=on                 # on = also check commands against this switch's own --help (background, pauses during requests)
MCP_SERVER_URL=               # optional remote MCP server
MCP_AUTH_TOKEN=

# ---- Model (applied by download + restart; no rebuild) ----
MODEL_REPO=unsloth/Qwen3.5-4B-GGUF
MODEL_FILE=Qwen3.5-4B-UD-Q4_K_XL.gguf   # 2.91 GB. Faster: MODEL_REPO=unsloth/Qwen3.5-2B-GGUF MODEL_FILE=Qwen3.5-2B-UD-Q4_K_XL.gguf
MODEL_SHA256=                 # optional integrity check
MODELS_DIR=                   # where the model file is kept on the switch (empty = ./models in this folder)

# ---- Build (applied by: dial0 ctl rebuild) ----
LLAMA_SOURCE=prebuilt         # prebuilt = official llama.cpp server image, nothing compiled (fast) | compile = build here
LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server   # for prebuilt; pin a release for reproducibility, e.g. ...:server-bNNNN
SONIC_UTILITIES_REF=auto      # auto = branch matching this switch's SONiC version (falls back to master)
LLAMA_CPP_REF=master          # for compile
CPU_TUNE=native               # for compile: native = fastest on this switch | portable = runs on other x86 CPUs
BUILD_JOBS=auto               # for compile: parallel jobs (auto = all cores but one)
KEEP_BUILD_CACHE=no           # yes = keep docker build cache (more disk); the base image is kept either way
HTTP_PROXY=                   # set if the switch reaches the internet through a proxy
HTTPS_PROXY=

# ---- Names ----
IMAGE=dial0-sonic:latest
CONTAINER=dial0
STATE_VOLUME=dial0-state
